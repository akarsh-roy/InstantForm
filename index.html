<!doctype html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MDNFL9WK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Get in touch</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #667085; --line: #d9deea; --accent: #5548e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; background: radial-gradient(circle at 15% 15%, #e8eaff, transparent 38%), #f6f7fb; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 480px); padding: clamp(24px, 6vw, 42px); background: white; border: 1px solid #edf0f6; border-radius: 22px; box-shadow: 0 20px 60px #29345b14; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.3rem); letter-spacing: -.04em; }
    .intro { margin: 10px 0 26px; color: var(--muted); }
    label { display: block; margin: 17px 0 7px; font-size: .9rem; font-weight: 650; }
    input, select { width: 100%; min-height: 48px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font: inherit; }
    input:focus, select:focus { outline: 3px solid #5548e82b; border-color: var(--accent); }
    .phone-row { display: grid; grid-template-columns: minmax(125px, .75fr) 1.5fr; gap: 10px; }
    button { width: 100%; min-height: 50px; margin-top: 24px; border: 0; border-radius: 10px; background: var(--accent); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #4438d4; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 1.5em; margin: 12px 0 0; color: var(--muted); font-size: .9rem; }
    #status.error { color: #b42318; }
    .privacy { margin: 17px 0 0; color: var(--muted); font-size: .78rem; }
    .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Contact form</p>
    <h1>Let’s connect</h1>
    <p class="intro">Share your email and phone number and we’ll be in touch.</p>
    <form id="contact-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
      <label for="country-code">Country code and contact number</label>
      <div class="phone-row">
        <select id="country-code" name="countryCode" aria-label="Country calling code" required>
          <option value="+1">🇺🇸/🇨🇦 +1</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+61">🇦🇺 +61</option>
          <option value="+91">🇮🇳 +91</option>
          <option value="+81">🇯🇵 +81</option>
          <option value="+49">🇩🇪 +49</option>
          <option value="+33">🇫🇷 +33</option>
          <option value="+55">🇧🇷 +55</option>
          <option value="+52">🇲🇽 +52</option>
          <option value="+971">🇦🇪 +971</option>
          <option value="+65">🇸🇬 +65</option>
          <option value="+27">🇿🇦 +27</option>
          <option value="+ other">Other</option>
        </select>
        <input id="phone" name="phone" type="tel" autocomplete="tel-national" inputmode="tel" placeholder="Contact number" required minlength="5" maxlength="20" pattern="[0-9 ()-]{5,20}" title="Enter 5–20 digits, spaces, parentheses, or hyphens.">
      </div>
      <div class="trap" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <button id="submit-button" type="submit">Send details</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy">Your details will be saved to a private Google Sheet for follow-up.</p>
  </main>
  <script>
    // Replace this with your deployed Google Apps Script web app URL (see README).
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiZ6AMQY3RbyxWSOC9ZV_18a4V1RA7qlGd48YoPLGt7ba5UIj-KpR80YxEgMMZ2Y6NFg/exec";
    const form = document.querySelector("#contact-form");
    const button = document.querySelector("#submit-button");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.classList.remove("error");
      if (form.website.value) return;
      if (!SCRIPT_URL.startsWith("https://script.google.com/")) {
        status.textContent = "The form is not connected yet. Follow the setup steps in the repository README.";
        status.classList.add("error");
        return;
      }
      button.disabled = true;
      button.textContent = "Sending…";
      status.textContent = "";
      const payload = {
        email: form.email.value.trim(),
        countryCode: form.countryCode.value,
        phone: form.phone.value.trim(),
        website: form.website.value
      };
      try {
        // Apps Script does not expose a normal CORS response to static pages.
        // no-cors sends the request; the sheet is the source of truth for receipt.
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        status.textContent = "Thanks! Your details were sent. You can close this page.";
        form.reset();
      } catch (error) {
        status.textContent = "We couldn’t send your details. Please check your connection and try again.";
        status.classList.add("error");
      } finally {
        button.disabled = false;
        button.textContent = "Send details";
      }
    });
  </script>
</body>
</html>
